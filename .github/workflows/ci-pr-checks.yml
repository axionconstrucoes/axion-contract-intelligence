name: CI PR Checks

# Verificações de Pull Request SEM efeitos externos.
# - Gatilho: pull_request (e execução manual). Nunca schedule.
# - Nenhum segredo e nenhuma variável do repositório são referenciados: o job roda sem
#   credenciais de Supabase, Gmail, Anthropic, Vercel ou ElevenLabs. Em PRs de forks o GitHub
#   já não fornece segredos; aqui também não há nenhum para fornecer.
# - Provedores de e-mail/IA: fake/bloqueados pelos próprios testes (--import block-live-ai).
# - Banco: PGlite em memória (descartável); as 119+ migrations são reaplicadas do zero em test:sql.
# - Permissões mínimas (somente leitura do conteúdo).

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: "true"
  NEXT_TELEMETRY_DISABLED: "1"
  AXION_EMAIL_PROVIDER: fake

jobs:
  guards:
    name: Guards (sem segredos, sem envio real)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Nenhum workflow de PR referencia segredos
        run: |
          if grep -nE '\$\{\{\s*(secrets|vars)\.' .github/workflows/ci-pr-checks.yml | grep -v '^\s*#' ; then
            echo "::error::ci-pr-checks.yml não pode referenciar secrets/vars"; exit 1
          fi
      - name: Nenhum arquivo .env versionado e script de envio real ausente
        run: |
          bad=$(git ls-files | grep -E '(^|/)\.env($|\.)' | grep -vE '\.env\.example$' || true)
          if [ -n "$bad" ]; then echo "::error::arquivos .env versionados: $bad"; exit 1; fi
          if git ls-files | grep -q 'scripts/tmp-send-real-batch.mjs'; then
            echo "::error::script de envio real não pode ser versionado"; exit 1
          fi
      - name: Nenhum padrão de segredo de alta especificidade no código versionado
        run: |
          PAT='-----BEGIN (RSA |EC |OPENSSH |DSA |PGP )?PRIVATE KEY-----|sk-ant-[A-Za-z0-9_-]{20,}|gh[pousr]_[A-Za-z0-9]{30,}|AKIA[0-9A-Z]{16}|GOCSPX-[A-Za-z0-9_-]{20,}|sb_secret_[A-Za-z0-9_-]{20,}|sbp_[a-f0-9]{40}|xox[abpr]-[A-Za-z0-9-]{10,}|postgres(ql)?://[^:[:space:]]+:[^@[:space:]]{6,}@[^[:space:]]+'
          hits=$(git grep -nIE -e "$PAT" -- . ':!package-lock.json' ':!.github/workflows/ci-pr-checks.yml' | grep -viE 'FALSO|FALSE|FAKE|fict|exemplo|example|@(127\.0\.0\.1|localhost)' || true)
          if [ -n "$hits" ]; then
            echo "::error::possível segredo versionado (mostrando só arquivo:linha)"
            echo "$hits" | cut -d: -f1,2
            exit 1
          fi
      - name: Sequência de migrations sem duplicidade de versão
        run: |
          dups=$(ls supabase/migrations | sed -E 's/_.*//' | sort | uniq -d)
          if [ -n "$dups" ]; then echo "::error::versões de migration duplicadas: $dups"; exit 1; fi
          echo "migrations: $(ls supabase/migrations | wc -l)"

  checks:
    name: Typecheck, lint e testes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      # Alguns testes do repositório afirmam que NÃO estão rodando dentro de um workflow (higiene: provam que não
      # disparam nem dependem de GitHub Actions; ex.: test-cron-routes-proxy-auth #16, test-pilot-risk-alert-audit W6).
      # O GitHub sempre define GITHUB_ACTIONS=true; removemos só essa variável do processo de teste (sem segredos).
      - name: Typecheck
        run: npx tsc --noEmit -p apps/web
      - name: Lint
        run: npm run lint
      - name: Testes unitários (web)
        run: env -u GITHUB_ACTIONS npm test
      - name: Testes de scripts
        run: env -u GITHUB_ACTIONS npm run test:scripts
      - name: Testes de e-mail (provider fake)
        run: env -u GITHUB_ACTIONS npm run test:email
      - name: Testes SQL (PGlite, replay completo das migrations)
        run: env -u GITHUB_ACTIONS npm run test:sql
      - name: Testes SSMA
        run: env -u GITHUB_ACTIONS npm run test:ssma
      - name: Simulação WEG e suíte de alertas
        run: |
          env -u GITHUB_ACTIONS npm run test:alert-sim
          env -u GITHUB_ACTIONS npm run test:alerts

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: checks
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Build (sem variáveis de produção)
        run: npm run build
