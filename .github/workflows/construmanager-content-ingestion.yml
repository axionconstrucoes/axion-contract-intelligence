# Monitoramento de metadados do Construmanager.
#
# ESCOPO: OBSERVAR E INFORMAR. NAO TRANSFERIR.
#
# A decisao de escopo tirou o download do caminho. O ACC detecta novos
# arquivos e novas revisoes; nenhum DWG, IFC ou PDF e' transferido. O
# step de ingestao de conteudo foi removido daqui — o worker e as
# funcoes de download continuam no repositorio, sem chamador.
#
# Nao ha gatilho `schedule` — apenas `workflow_dispatch`. Ativar a
# automacao periodica e descomentar o bloco `schedule` abaixo, em commit
# proprio e revisado. Ate la, nada roda sozinho.
#
# Mesmo disparado a mao, cada processo so age se seu interruptor
# autorizar, e o valor precisa ser exatamente "true":
#
#   A. metadados -> CONSTRUMANAGER_METADATA_SYNC_ENABLED
#   B. vigencia  -> CONSTRUMANAGER_VERSION_MONITORING_ENABLED
#
# Ausentes, a rodada termina sem tocar em nada (fail-closed).
# CONSTRUMANAGER_AUTO_DOWNLOAD_ENABLED nao e' lido por nenhum step: nao
# existe caminho de codigo aqui capaz de baixar conteudo.
#
# POR QUE GITHUB ACTIONS E NAO VERCEL CRON
#
#   1. Precedente do proprio projeto: gmail-inbound-sync.yml ja usa
#      exatamente este padrao (workflow + script standalone + secret key).
#   2. apps/web/proxy.ts exige sessao Supabase em todas as rotas exceto
#      /login e /auth/callback. Uma rota de cron sem cookie levaria 307
#      para /login — ativa-la exigiria abrir o perimetro de autenticacao.
#   3. Duracao: funcao Vercel encerra em 300 s; um job aqui pode durar
#      bem mais, com `timeout-minutes` explicito como trava.

name: Construmanager Metadata Monitoring

on:
  # schedule:
  #   - cron: "17 * * * *"   # DESATIVADO — ver cabecalho
  workflow_dispatch:
    inputs:
      project_id:
        description: "Project id do ACC"
        required: false
        default: "00000000-0000-4000-8000-000000000001"

# Uma rodada por vez. O lease no banco protege contra workers
# concorrentes; isto evita que eles sequer sejam criados.
concurrency:
  group: construmanager-metadata-monitoring
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Processo A — sincronizacao de metadados. E o step que descobre
      # uma revisao nova na API. Roda PRIMEIRO e com interruptor proprio.
      - name: Sync Construmanager metadata
        run: node scripts/construmanager-metadata-worker.mjs "${{ inputs.project_id }}"
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          CONSTRUMANAGER_LOGIN: ${{ secrets.CONSTRUMANAGER_LOGIN }}
          CONSTRUMANAGER_PASSWORD: ${{ secrets.CONSTRUMANAGER_PASSWORD }}
          CONSTRUMANAGER_BASE_URL: ${{ secrets.CONSTRUMANAGER_BASE_URL }}
          CONSTRUMANAGER_METADATA_SYNC_ENABLED: ${{ vars.CONSTRUMANAGER_METADATA_SYNC_ENABLED }}
          CONSTRUMANAGER_VERSION_MONITORING_ENABLED: ${{ vars.CONSTRUMANAGER_VERSION_MONITORING_ENABLED }}
          CONSTRUMANAGER_AUTO_KILL_SWITCH: ${{ vars.CONSTRUMANAGER_AUTO_KILL_SWITCH }}

      # Processo C — ingestao de conteudo: REMOVIDO.
      #
      # A decisao de escopo tirou o download do caminho: o ACC monitora
      # informacoes e nao transfere desenhos. O worker e as funcoes de
      # download continuam no repositorio, sem chamador — reverter e
      # voltar a chamar, nao reescrever.
      #
      # Sem este step, nenhuma execucao deste workflow pode abrir
      # Objeto/Download nem criar vinculo pendente, independentemente do
      # valor de qualquer variavel.

      # Processo B — monitoramento de versao vigente. Roda como STEP
      # SEPARADO e com interruptor proprio: se os downloads estiverem
      # desligados, o step acima encerra sem fazer nada e ESTE ainda
      # executa. Nao recebe CONSTRUMANAGER_AUTO_DOWNLOAD_ENABLED — nao
      # existe caminho para um habilitar o outro.
      - name: Monitor Construmanager version vigency
        if: always()
        run: node scripts/construmanager-version-monitor.mjs "${{ inputs.project_id }}"
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          CONSTRUMANAGER_VERSION_MONITORING_ENABLED: ${{ vars.CONSTRUMANAGER_VERSION_MONITORING_ENABLED }}
          CONSTRUMANAGER_AUTO_KILL_SWITCH: ${{ vars.CONSTRUMANAGER_AUTO_KILL_SWITCH }}
