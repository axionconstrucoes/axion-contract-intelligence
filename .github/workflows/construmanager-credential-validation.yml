# Validacao isolada do SUPABASE_SECRET_KEY do GitHub Actions.
#
# Existe por um motivo concreto: secrets do GitHub sao write-only pela
# API. Nao ha como conferir de fora se o valor guardado corresponde a uma
# sb_secret valida do projeto — e foi exatamente um descasamento desses
# que quebrou o primeiro download do piloto com "Invalid Compact JWS". O
# worker headless usa o mesmo segredo.
#
# ISOLAMENTO DELIBERADO
#
# Este workflow NAO reaproveita nenhum step do workflow operacional. Ele
# roda um unico script que faz uma unica requisicao GET. Nao ha caminho
# de codigo aqui capaz de executar o metadata worker, o version monitor
# ou o content worker: os scripts deles nem sao invocados.
#
# Nao recebe:
#   - credenciais do Construmanager (logo, nao pode chamar Objeto/Download);
#   - as variaveis dos tres interruptores (logo, nada seria habilitado
#     mesmo que o codigo tentasse);
#   - token da Vercel;
#   - permissao de escrita no repositorio.
#
# Nao produz artifact e nao usa cache — nada que possa reter o segredo
# alem da vida do processo.

name: Construmanager Credential Validation

# Disparo manual apenas. Sem schedule, sem push, sem pull_request:
# uma verificacao de credencial nao deve acontecer sozinha.
on:
  workflow_dispatch:

concurrency:
  group: construmanager-credential-validation
  cancel-in-progress: false

# Minimo possivel. Nenhuma escrita, nenhum deployment, nenhum package.
permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    # Uma requisicao GET com timeout de 20 s nao precisa de mais que isto.
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          # Sem `cache: npm` de proposito: o script nao tem dependencia
          # externa, e um cache a menos e uma superficie a menos.

      - name: Validate Supabase secret (GET only, no SDK)
        # O segredo chega SOMENTE por env. Nunca em argv: a linha de
        # comando aparece na lista de processos do runner.
        run: node scripts/validate-github-supabase-secret.mjs
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
