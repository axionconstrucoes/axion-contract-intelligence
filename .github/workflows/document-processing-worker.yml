name: Document Processing Worker

on:
  schedule:
    - cron: "*/5 * * * *"

  workflow_dispatch:

concurrency:
  group: document-processing-worker
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  process-documents:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Find and process pending non-MPP files
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { createClient } from "@supabase/supabase-js";
          import { spawnSync } from "node:child_process";

          const url = process.env.NEXT_PUBLIC_SUPABASE_URL;
          const key = process.env.SUPABASE_SECRET_KEY;

          if (!url || !key) {
            throw new Error("Supabase credentials are missing.");
          }

          const supabase = createClient(url, key, {
            auth: {
              persistSession: false,
              autoRefreshToken: false,
            },
          });

          const { data, error } = await supabase
            .from("document_versions")
            .select("id,original_file_name,mime_type,processing_status")
            .eq("processing_status", "AWAITING_PROCESSING")
            .order("uploaded_at", { ascending: true })
            .limit(50);

          if (error) {
            throw error;
          }

          const pending = (data ?? []).filter((row) => {
            const isMpp =
              row.mime_type === "application/vnd.ms-project" ||
              row.original_file_name?.toLowerCase().endsWith(".mpp");

            return !isMpp;
          });

          console.log(`Documentos pendentes (não-MPP): ${pending.length}`);

          for (const row of pending) {
            console.log(`Processando ${row.id} - ${row.original_file_name}`);

            const result = spawnSync(
              "node",
              ["scripts/process-document-version.mjs", row.id],
              {
                stdio: "inherit",
                env: process.env,
              }
            );

            if (result.status !== 0) {
              console.error(`Falha ao processar ${row.id}`);
              process.exitCode = 1;
            }
          }
          NODE
